<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Family Table</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#304c3d;background:#f6f0e8}*{box-sizing:border-box}body{margin:0}header{background:#e8e5d8;padding:22px 18px;text-align:center}h1{font-family:Georgia,serif;font-size:30px;margin:0}header p{margin:5px;color:#6c776a}.wrap{max-width:640px;margin:auto;padding:16px 16px 95px}.card{background:#fff;border-radius:16px;padding:17px;margin:13px 0;box-shadow:0 2px 10px #304c3d0b}h2{font-family:Georgia,serif;margin:8px 0 12px;font-size:23px}h3{margin:4px 0 8px}p,small{line-height:1.45}small,.muted{color:#6b746b}button,input,select,textarea{font:inherit;font-size:16px;border-radius:10px;padding:12px;border:1px solid #d6d9d2;max-width:100%}input,textarea,select{width:100%;background:#fff;margin:5px 0 9px}button{background:#456c54;color:white;border:0;cursor:pointer;font-weight:600}button.secondary{background:#e7efe7;color:#345640}button.outline{background:white;color:#456c54;border:1px solid #456c54}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1}.event{display:block;width:100%;text-align:left;background:#fff;color:#304c3d;border:1px solid #e0e5dc;margin:8px 0}.event small{display:block;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;border-top:1px solid #ddd;padding:8px 4px max(9px,env(safe-area-inset-bottom))}nav button{flex:1;max-width:150px;background:transparent;color:#647568;font-size:12px;padding:8px 2px}nav button.active{background:#e7efe7;color:#345640}label{display:block;font-weight:600;margin-top:8px}.row{display:flex;align-items:center;gap:8px}.row input[type=checkbox]{width:auto}.row .grow{flex:1} .hero{background:linear-gradient(125deg,#e8d8b8,#e5efdf);border-radius:16px;padding:25px 18px} .tag{font-size:12px;background:#e5eee6;border-radius:20px;padding:5px 9px} .hidden{display:none} .note{font-size:12px;color:#776c5d}
</style></head><body><header><h1>🌺 Our Family Table</h1><p>Gather · Share · Remember</p></header><main class="wrap" id="app"></main><nav id="nav"></nav><script>
const KEY='oft-demo-v1';const defaults={events:[{id:1,name:'Thanksgiving Dinner',place:'Washington',date:'2026-11-26',mine:true,dishes:[{name:'Turkey',by:''},{name:'Stuffing',by:''},{name:'Mashed potatoes',by:''}]},{id:2,name:'Hawaii Family Dinner',place:'Maui, Hawaii',date:'',mine:false,dishes:[]}],recipes:[],orders:0};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{data=structuredClone(defaults)}let page='home',view='mine',selected=1;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const el=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Date to be decided';function go(p){page=p;render();scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=[['home','🏠 Home'],['events','📅 Events'],['recipes','📖 Recipes'],['albums','📸 Albums']].map(([id,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('');if(page==='home')el.innerHTML=`<div class="hero"><h2>Aloha, Family! 💚</h2><p>Good things happen when we gather together.</p></div><h2>Upcoming gatherings</h2><div class="buttons"><button class="${view==='mine'?'':'secondary'}" onclick="view='mine';render()">My Events</button><button class="${view==='all'?'':'secondary'}" onclick="view='all';render()">All Family Events</button></div>${data.events.filter(e=>view==='all'||e.mine).map(eventCard).join('')||'<p>No gatherings yet.</p>'}<div class="card"><h3>Family memories</h3><p>Save family recipes and plan photo books twice a year.</p><div class="buttons"><button onclick="go('recipes')">Recipes</button><button onclick="go('albums')">Albums</button></div></div>`;if(page==='events')el.innerHTML=`<h2>Family Gatherings</h2>${data.events.map(eventCard).join('')}<div class="card"><h3>Plan a gathering</h3><form id="eventForm"><label>Event name<input name="name" required placeholder="Sunday family dinner"></label><label>Date<input name="date" type="date"></label><label>Location<input name="place" placeholder="Maui, Hawaii" required></label><button type="submit">Create gathering</button></form></div>`;if(page==='detail'){let e=data.events.find(x=>x.id===selected);if(!e){go('events');return}el.innerHTML=`<button class="secondary" onclick="go('events')">← Gatherings</button><h2>${esc(e.name)}</h2><p>${esc(e.place)} · ${date(e.date)}</p><div class="card"><h3>Who's bringing what?</h3>${e.dishes.map((d,i)=>`<div class="row"><div class="grow"><strong>${esc(d.name)}</strong><input aria-label="Person bringing ${esc(d.name)}" placeholder="Who's bringing this?" value="${esc(d.by)}" onchange="setDishOwner(${i},this.value)"></div></div>`).join('')||'<p>No dishes yet.</p>'}<form id="dishForm"><label>Add a dish<input name="dish" placeholder="Green bean casserole" required></label><button type="submit">Add dish</button></form></div><div class="card"><h3>Recipes & photos</h3><p>Open the family recipe box or album planner.</p><div class="buttons"><button onclick="go('recipes')">Recipes</button><button onclick="go('albums')">Albums</button></div></div>`}if(page==='recipes')el.innerHTML=`<h2>Grandma's Recipe Box 💚</h2><p>Keep the recipes your family loves in one place.</p>${data.recipes.map((r,i)=>`<div class="card"><h3>${esc(r.name)}</h3><small>From ${esc(r.from||'Family')}</small><p style="white-space:pre-wrap">${esc(r.text)}</p></div>`).join('')}<div class="card"><h3>Add a family recipe</h3><form id="recipeForm"><label>Recipe name<input name="name" required></label><label>Who made it?<input name="from" placeholder="Grandma"></label><label>Ingredients and instructions<textarea name="text" rows="6" placeholder="Type the recipe here..."></textarea></label><button type="submit">Save recipe</button></form></div>`;if(page==='albums')el.innerHTML=`<h2>Family Memory Books 📸</h2><div class="card"><h3>Volume 1 · January–June 2027</h3><p>Family photo deadline: <strong>June 30</strong></p><p>Printing planned for July.</p></div><div class="card"><h3>Volume 2 · July–December 2027</h3><p>Family photo deadline: <strong>December 31</strong></p><p>Printing planned for January.</p></div><div class="card"><h3>Printed copies</h3><p>Grandparents receive the default copy. Others can choose extra copies.</p><label>Extra copies for my household<input type="number" min="0" max="20" value="${data.orders}" onchange="data.orders=Math.max(0,Number(this.value)||0);save()"></label></div><p class="note">Photo uploading and actual printing are not connected yet.</p>`;const ef=document.getElementById('eventForm');if(ef)ef.onsubmit=ev=>{ev.preventDefault();let f=new FormData(ef);data.events.push({id:Date.now(),name:f.get('name'),date:f.get('date'),place:f.get('place'),mine:true,dishes:[]});save();render()};const df=document.getElementById('dishForm');if(df)df.onsubmit=ev=>{ev.preventDefault();data.events.find(x=>x.id===selected).dishes.push({name:new FormData(df).get('dish'),by:''});save();render()};const rf=document.getElementById('recipeForm');if(rf)rf.onsubmit=ev=>{ev.preventDefault();let f=new FormData(rf);data.recipes.push({name:f.get('name'),from:f.get('from'),text:f.get('text')});save();render()}}function eventCard(e){return `<button class="event" onclick="selected=${e.id};go('detail')"><strong>${esc(e.name)}</strong><small>${date(e.date)} · ${esc(e.place)}</small></button>`}function setDishOwner(i,v){data.events.find(x=>x.id===selected).dishes[i].by=v;save()}render();
</script></body></html>
